<!DOCTYPE html>
<html>
<head>

<title>Employee Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#111;
color:white;
}

table{
width:100%;
margin-top:20px;
}

th,td{
border:1px solid #444;
padding:10px;
}

</style>

</head>

<body>

<div class="container py-4">

<h1 class="text-center">Employee Management System</h1>

<div class="row g-3">

<div class="col-md-6">
<input type="text" id="empName" class="form-control" placeholder="Employee Name">
</div>

<div class="col-md-6">
<input type="number" id="empId" class="form-control" placeholder="Employee ID">
</div>

<div class="col-md-6">
<input type="number" id="empSalary" class="form-control" placeholder="Salary">
</div>

<div class="col-md-6">
<input type="text" id="empDept" class="form-control" placeholder="Department">
</div>

</div>

<button class="btn btn-primary mt-3" onclick="addEmployee()">
Add Employee
</button>

<button class="btn btn-success mt-3" onclick="displayEmployees()">
Display Employees
</button>

<div id="resultArea"></div>

</div>

<script>

let employees = [];

function addEmployee(){

let name = document.getElementById("empName").value;
let id = document.getElementById("empId").value;
let salary = document.getElementById("empSalary").value;
let dept = document.getElementById("empDept").value;

let employee = {
name:name,
id:id,
salary:salary,
department:dept
};

employees.push(employee);

alert("Employee Added");

}

function displayEmployees(){

let html = `
<table>
<tr>
<th>ID</th>
<th>Name</th>
<th>Department</th>
<th>Salary</th>
</tr>
`;

employees.forEach(function(emp){

html += `
<tr>
<td>${emp.id}</td>
<td>${emp.name}</td>
<td>${emp.department}</td>
<td>${emp.salary}</td>
</tr>
`;

});

html += `</table>`;

document.getElementById("resultArea").innerHTML = html;

}

</script>

</body>
</html>
