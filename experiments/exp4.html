<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Result Calculator</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container py-5">
<div class="row justify-content-center">
<div class="col-md-6">

<div class="card shadow-lg">
<div class="card-body p-4">

<h2 class="text-center mb-3">Student Result Calculator</h2>

<p class="text-center text-muted">
Enter number of subjects and calculate your result
</p>

<div class="mb-3">
<label class="form-label">Number of Subjects</label>

<input type="number"
id="numSubjects"
class="form-control"
placeholder="Enter number of subjects"
min="1"
max="20">
</div>

<div class="d-grid">
<button class="btn btn-primary" onclick="calculateResult()">
Calculate Result
</button>
</div>

<div id="resultBox" class="mt-4 d-none"></div>

</div>
</div>

</div>
</div>
</div>

<script>

function calculateResult() {

let numSubjects = parseInt(document.getElementById("numSubjects").value);

if (isNaN(numSubjects) || numSubjects <= 0) {
alert("Please enter a valid number of subjects.");
return;
}

let totalMarks = 0;

for (let i = 1; i <= numSubjects; i++) {

let mark = parseFloat(prompt("Enter marks for Subject " + i));

if (isNaN(mark) || mark < 0 || mark > 100) {
alert("Invalid marks");
return;
}

totalMarks += mark;
}

let averageMarks = totalMarks / numSubjects;

let grade = "";

if (averageMarks >= 90)
grade = "A";

else if (averageMarks >= 75)
grade = "B";

else if (averageMarks >= 60)
grade = "C";

else if (averageMarks >= 40)
grade = "D";

else
grade = "F";

let resultStatus = averageMarks >= 40 ? "PASS" : "FAIL";

let resultBox = document.getElementById("resultBox");

resultBox.innerHTML = `
<h3>Result Summary</h3>

<p>Total Marks : ${totalMarks}</p>

<p>Average Marks : ${averageMarks.toFixed(2)}</p>

<p>Grade : ${grade}</p>

<p>Result : ${resultStatus}</p>
`;

resultBox.classList.remove("d-none");
}

</script>

</body>
</html>
